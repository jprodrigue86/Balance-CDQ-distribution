<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CDQ — Poids et étalons · Visionneuse CDQ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#eaf3fa;font-family:Arial,sans-serif}
#reader{display:block;width:100%;height:100%;border:0;background:#101820}
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#101820}
#overlay[hidden]{display:none}.panel{max-width:420px;text-align:center}.panel h1{font-size:20px;margin:0 0 12px}
.panel p{color:#bfd0df;line-height:1.55;font-size:15px}
.spinner{width:32px;height:32px;margin:0 auto 18px;border:3px solid #486477;border-top-color:#4bcaff;border-radius:50%;animation:spin .8s linear infinite}
.spinner[hidden]{display:none}
button,.fallback{font:600 15px Arial;border-radius:10px;min-height:44px;padding:12px 18px;background:#007dc2;border:1px solid #49b9f0;color:#fff;text-decoration:none;cursor:pointer;display:inline-block;margin:4px}
button[hidden],.fallback[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
<div id="overlay" role="status" aria-live="polite">
 <div class="panel">
  <div id="spinner" class="spinner"></div>
  <h1 id="heading">Ouverture de la visionneuse CDQ</h1>
  <p id="message">Chargement automatique du certificat « Poids et étalons » dans la visionneuse CDQ.</p>
  <button id="retry" hidden>Réessayer</button>
  <a id="download" class="fallback" href="./Certificat_poids_etalons_CDQ_entete_actuel_interactif.pdf" download hidden>Télécharger le PDF</a>
 </div>
</div>
<iframe id="reader" title="Visionneuse CDQ — Certificat Poids et étalons" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
(()=>{
'use strict';
const PDF_NAME="Certificat_poids_etalons_CDQ_entete_actuel_interactif.pdf";
const PDF_SIZE=1248097;
const PDF_SHA256="38017f36ad89947b175726db97178ff82e8bcbca9e19cce41b0ff9636cdb537e";
const REQUEST_ID="cdq-poids-etalons-20261105";
const pdfURL=new URL("./"+PDF_NAME,location.href);
const readerURL=new URL("../reader-v2525.html",location.href);
const frame=document.getElementById("reader");
const overlay=document.getElementById("overlay");
const heading=document.getElementById("heading");
const message=document.getElementById("message");
const spinner=document.getElementById("spinner");
const retry=document.getElementById("retry");
const download=document.getElementById("download");
let sent=false,opened=false,failed=false;
function error(err){
 if(opened)return;
 failed=true;overlay.hidden=false;spinner.hidden=true;retry.hidden=false;download.hidden=false;
 heading.textContent="Le PDF ne s'est pas ouvert";
 message.textContent=String(err?.message||err||"Erreur inconnue").slice(0,280);
}
retry.addEventListener("click",()=>location.reload());
const pdfPromise=fetch(pdfURL.href,{cache:"no-store",credentials:"same-origin"}).then(async response=>{
 if(!response.ok)throw Error("PDF indisponible (HTTP "+response.status+").");
 const bytes=await response.arrayBuffer();
 if(bytes.byteLength!==PDF_SIZE||new TextDecoder().decode(bytes.slice(0,5))!=="%PDF-")
   throw Error("Le fichier PDF ne correspond pas au certificat attendu.");
 const digest=await crypto.subtle.digest("SHA-256",bytes);
 const sha=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");
 if(sha!==PDF_SHA256)throw Error("Le certificat a changé depuis sa préparation.");
 return new Blob([bytes],{type:"application/pdf"});
});
pdfPromise.catch(error);
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
 const data=event.data||{};
 if(data.type==="CDQ_READER_READY"&&!sent&&!failed){
  sent=true;
  heading.textContent="Visionneuse CDQ prête";
  message.textContent="Ouverture du certificat…";
  pdfPromise.then(blob=>{
   frame.contentWindow.postMessage({
    type:"CDQ_READER_OPEN",readerRequestId:REQUEST_ID,
    blob,name:PDF_NAME,readOnly:false
   },location.origin);
  }).catch(error);
 }
 if(data.type==="CDQ_READER_OPENED"&&data.readerRequestId===REQUEST_ID){
  opened=true;overlay.hidden=true;document.title="CDQ — Poids et étalons";
 }
 if(data.type==="CDQ_READER_INIT_FAILED_V2731"||data.type==="CDQ_READER_OPEN_FAILED_V2731")
  error(data.error||"La visionneuse CDQ n'a pas pu charger le document.");
 if(data.type==="CDQ_READER_CLOSE"&&opened){
  opened=false;failed=true;overlay.hidden=false;spinner.hidden=true;retry.hidden=false;
  heading.textContent="Essai terminé";message.textContent="Le certificat est fermé.";retry.textContent="Rouvrir le PDF";
 }
});
frame.src=readerURL.href;
setTimeout(()=>{if(!opened&&!failed)error("La visionneuse prend trop de temps à démarrer. Réessayez.");},60000);
})();
</script></body></html>
