 if(!response.ok)throw Error('PDF source indisponible : HTTP '+response.status);

<script>
(()=>{

function install(){
 let d;try{d=frame.contentDocument;}catch(_){return;}
 if(!d?.head)return;
 if(observedDoc!==d){observer?.disconnect();observedDoc=d;observer=null;}
 if(!d.getElementById('cdq-one-border-owner-v7')){
  const s=d.createElement('style');

 }
 function mark(){

        canvasCount:sect?.querySelectorAll('canvas').length||0,

      hasOwnCanvas:marked.filter(x=>x.classList.contains('hasOwnCanvas')).length,

<script id="cdq-nav-v10">
(()=>{
'use strict';
const frame=document.getElementById('viewer');let installed=null,last=null;
function rank(name){
 let m=/^essai_cdq_charge_point_(\d+)_(charge_utilisee|charge_contrainte|avant_correction|apres_correction)$/.exec(name);
 if(m)return ['charge_utilisee','charge_contrainte','avant_correction','apres_correction'].indexOf(m[2])*100+Number(m[1]);
 if(name==='essai_cdq_charge_excentricite')return 900;
 m=/^essai_cdq_excentricite_(avant|apres)_(arriere_gauche|avant_gauche|arriere_droit|avant_droit)$/.exec(name);
 return m?901+(m[1]==='apres'?4:0)+['arriere_gauche','avant_gauche','arriere_droit','avant_droit'].indexOf(m[2]):null;
}
function ordered(d){
 const v=d.getElementById('viewer');if(!v)return [];
 const f=[...v.querySelectorAll('.textWidgetAnnotation :is(input,textarea),.choiceWidgetAnnotation select,button[data-cdq-choice]')].filter(x=>
   !!x.name&&!x.disabled&&!x.readOnly&&!x.dataset.cdqChoiceSource&&x.getClientRects().length>0
   &&d.defaultView.getComputedStyle(x).visibility!=='hidden'&&
   (x.dataset.cdqNavIndex!==undefined||x.tabIndex>=0));
 const q=f.map((el,i)=>({el,i,r:rank(el.name),g:el.getBoundingClientRect()}));
 q.sort((a,b)=>{const tol=Math.max(3,Math.min(a.g.height,b.g.height)*.45),dy=a.g.top-b.g.top;
   if(Math.abs(dy)>tol)return dy;return Math.abs(a.g.left-b.g.left)>1?a.g.left-b.g.left:a.i-b.i;});
 const first=q.filter(x=>x.r!==null&&x.r<900).sort((a,b)=>a.r-b.r);
 const second=q.filter(x=>x.r!==null&&x.r>=900).sort((a,b)=>a.r-b.r);
 const out=[];let has1=false,has2=false;
 for(const x of q){
   if(x.r!==null&&x.r<900){if(!has1){out.push(...first.map(y=>y.el));has1=true;}}
   else if(x.r!==null){if(!has2){out.push(...second.map(y=>y.el));has2=true;}}
   else out.push(x.el);
 }
 return [...new Set(out)];
}
function go(d,delta,active){
 if(d.getElementById('choiceDialog')?.open)return false;
 const fields=ordered(d),activeIndex=fields.indexOf(active),i=activeIndex>=0?activeIndex:fields.indexOf(last),target=fields[i+delta];
 if(i<0||!target)return false;
 last=target;target.focus({preventScroll:true});
 const box=d.getElementById('container'),r=target.getBoundingClientRect(),b=box.getBoundingClientRect();
 if(r.top<b.top+40)box.scrollTop+=r.top-b.top-60;
 else if(r.bottom>b.bottom-30)box.scrollTop+=r.bottom-b.bottom+60;
 if(r.left<b.left+15)box.scrollLeft+=r.left-b.left-25;
 else if(r.right>b.right-15)box.scrollLeft+=r.right-b.right+25;
 if(target.dataset.cdqChoice==='true'&&target.tagName==='BUTTON')target.click();
 return true;
}
function audit(d){
 if(!new URLSearchParams(location.search).has('qa'))return;
 const v=d.getElementById('viewer');
 const sample={};for(const name of ['essai_cdq_client_technicien','essai_cdq_unite','essai_cdq_legal_commerce','essai_cdq_frequence_etalonnage','essai_cdq_probleme_constate','essai_cdq_charge_point_1_charge_contrainte','essai_cdq_bloc3_red']){
  const el=v.querySelector('[name="'+name+'"]');sample[name]={found:!!el,type:el?.tagName,value:el?.value,options:el?.tagName==='SELECT'?[...el.options].map(x=>x.value):null};
 }
 const obj={ready:v.dataset.ready,menus:[...v.querySelectorAll('button.cdq-choice-field')].map(x=>x.name),navigation:ordered(d).map(x=>x.name),sample};
 const p=document.getElementById('v10qa')||document.createElement('pre');p.id='v10qa';
 p.style.cssText='position:fixed;right:0;bottom:0;z-index:99999;width:min(90vw,620px);max-height:55dvh;overflow:auto;padding:12px;background:white;color:black;white-space:pre-wrap;font:11px monospace';
 p.textContent=JSON.stringify(obj,null,2);document.body.append(p);
}
function install(){
 let d;try{d=frame.contentDocument;}catch(_){return}
 if(!d?.getElementById('viewer')||installed===d)return;
 installed=d;const v=d.getElementById('viewer');
 v.addEventListener('focusin',e=>{if(e.target.name)last=e.target},true);
 d.addEventListener('click',e=>{
  const btn=e.target.closest?.('#nextField,#previousField');if(!btn||btn.disabled)return;
  if(go(d,btn.id==='nextField'?1:-1,d.activeElement?.name?d.activeElement:last)){
   e.preventDefault();e.stopImmediatePropagation();
  }
 },true);
 d.addEventListener('keydown',e=>{
  if(e.key!=='Tab'||e.altKey||e.ctrlKey||e.metaKey||e.isComposing||!v.contains(e.target)||!e.target.name)return;
  if(go(d,e.shiftKey?-1:1,e.target)){e.preventDefault();e.stopImmediatePropagation();}
 },true);
 if(new URLSearchParams(location.search).has('qa'))setInterval(()=>audit(d),1800);
}
frame.addEventListener('load',install);
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&(e.data?.type==='CDQ_READER_READY'||e.data?.type==='CDQ_READER_OPENED'))setTimeout(install,200);});
install();
})();
</script>
