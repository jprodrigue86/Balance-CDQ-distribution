   while(pos<patch.length){
     const op=patch[pos++];
     if(op===0){
       if(pos+8>patch.length)throw Error("Correctif tronqué (copie).");
       const start=view.getUint32(pos);pos+=4;
       const length=view.getUint32(pos);pos+=4;
       if(start+length>original.length||dest+length>output.length)throw Error("Données de copie invalides.");
       output.set(original.subarray(start,start+length),dest);
       dest+=length;
     }else if(op===1){
       if(pos+4>patch.length)throw Error("Correctif tronqué (données).");
       const length=view.getUint32(pos);pos+=4;
       if(pos+length>patch.length||dest+length>output.length)throw Error("Données intégrées invalides.");
       output.set(patch.subarray(pos,pos+length),dest);
       pos+=length;
       dest+=length;
     }else throw Error("Opération du correctif inconnue.");
   }
   if(dest!==targetSize||hex(output.subarray(0,5))!=="255044462d"
       ||(await checksum(output))!==EXPECTED_TARGET_SHA)
     throw Error("Contrôle d’intégrité du PDF corrigé échoué.");
   return new Blob([output],{type:"application/pdf"});
 }
 const pdfPromise=loadCorrectedPDF();
 pdfPromise.catch(fail);
 window.addEventListener("message",event=>{
   if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
   const data=event.data||{};
   if(data.type==="CDQ_READER_READY"&&!sent){
     sent=true;
     pdfPromise.then(blob=>{
       frame.contentWindow.postMessage({
         type:"CDQ_READER_OPEN",
         readerRequestId:"cdq-plancher-correction-v2-20261030",
         blob,name:NAME,readOnly:false
       },location.origin);
     }).catch(fail);
   }
   if(data.type==="CDQ_READER_OPENED"){
     opened=true;loading.hidden=true;document.title="CDQ — "+NAME;
   }
   if(data.type==="CDQ_READER_INIT_FAILED_V2731"||data.type==="CDQ_READER_OPEN_FAILED_V2731")
     fail(data.error||"La Visionneuse CDQ n’a pas pu ouvrir le PDF.");
   if(data.type==="CDQ_READER_CLOSE"&&opened){
     loading.hidden=false;retry.hidden=false;spinner.hidden=true;
     heading.textContent="Essai terminé";
     message.textContent="Le document d’essai est fermé.";
     retry.textContent="Rouvrir le PDF corrigé";
   }
 });
 frame.src=readerUrl.href;
 setTimeout(()=>{
   if(!opened&&retry.hidden)fail("La Visionneuse CDQ n’a pas terminé l’ouverture du PDF.");
 },45000);
})();
