name: Intermediaire V22 - echelon decimal test isole
on:
  push:
    branches: [work/pdf-v22-echelon-decimal-20261031]
    paths:
      - ops/pdf-v22/**
      - essais/menu-problemes-multiples-v22/**
      - .github/workflows/pdf-echelon-v22.yml
permissions:
  contents: read
jobs:
  decimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test reader decimal input and native PDF tolerance
        run: node ops/pdf-v22/test_echelon.mjs
      - name: Install native PDF inspector
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Inspect the original PDF and extract its JavaScript
        run: python ops/pdf-v22/extract_native.py
      - name: Test original PDF calculations with 0.5 and 0,5
        run: node ops/pdf-v22/test_native_half.cjs
