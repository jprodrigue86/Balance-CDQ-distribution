name: Plancher V19 - diagnostic PDF isole
on:
  push:
    branches:
      - work/pdf-plancher-v19-rectangles-20261031
    paths:
      - ops/pdf-v19/**
      - .github/workflows/pdf-plancher-v19.yml
permissions:
  contents: write
jobs:
  inspect-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF inspector
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Inspect latest trial without changing approved source
        run: python ops/pdf-v19/inspect.py
      - name: Save compact inspection evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essais-plancher-v19-largeurs-20261031/inspection-v18.json
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Preserve V18 geometry inspection for isolated V19"
            git push origin HEAD:work/pdf-plancher-v19-rectangles-20261031
          fi
