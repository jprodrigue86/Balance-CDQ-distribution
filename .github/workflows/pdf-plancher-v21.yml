name: Plancher V21 - essais excentricite isoles
on:
  push:
    branches: [work/pdf-excentricite-v21-20261031]
    paths:
      - ops/pdf-v21/**
      - .github/workflows/pdf-plancher-v21.yml
permissions:
  contents: write
jobs:
  test-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Build verified V21 native PDF
        run: python ops/pdf-v21/build_v21.py
      - name: Syntax-check the actual native PDF JavaScript
        run: node --check /tmp/cdq-plancher-v21-native.js
      - name: Test per-corner colors using embedded document JavaScript
        run: node ops/pdf-v21/test_native.cjs
      - name: Preserve compact V20 diagnostics on work branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essais-plancher-v21-fleches-20261031/CDQ_Intermediaire_Essai_Fonctionnel_V21.pdf essais-plancher-v21-fleches-20261031/qa-v21.json
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Preserve corrected V21 and QA separately"
            git push origin HEAD:work/pdf-excentricite-v21-20261031
          fi
