name: Plancher V20 - inspection et correction isolee
on:
  push:
    branches: [work/pdf-plancher-v20-entete-focus-20261031]
    paths:
      - ops/pdf-v20/**
      - .github/workflows/pdf-plancher-v20.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: PDF inspection package
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Verify PDF V20 original glyph replacement, field and unaffected pixels
        run: python ops/pdf-v20/build_v20.py
      - name: Preserve tested trial PDF (not the official app)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essais-plancher-v20-intermediaire-focus-20261031/CDQ_Plancher_Essai_Fonctionnel_V20.pdf essais-plancher-v20-intermediaire-focus-20261031/qa-v20.json
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Preserve V20 isolated PDF with verified header, type and widgets"
            git push origin HEAD:work/pdf-plancher-v20-entete-focus-20261031
          fi
