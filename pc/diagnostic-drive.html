<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CDQ — Diagnostic vitesse Google Drive</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#101827;color:#e9f1ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
header{background:#17243a;border-bottom:1px solid #3d516a;padding:8px 12px;flex:none;box-shadow:0 1px 7px #0003}
.topline,.actions,.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topline{justify-content:space-between}
h1{font-size:15px;margin:0;font-weight:700}
small{color:#a9b9cf}
#state{font-size:12px;color:#bdcce2}
#state[data-active=true]{color:#9ce7b5}
.actions{margin-top:8px}
button,a.btn{font:inherit;font-size:12px;padding:8px 10px;color:#eaf5ff;background:#273952;border:1px solid #526985;border-radius:7px;cursor:pointer;text-decoration:none}
button.primary{background:#1975b5;border-color:#268fd7;font-weight:650}
button:focus-visible,a:focus-visible{outline:2px solid #9ddefe;outline-offset:2px}
button:hover,a.btn:hover{background:#36516d}
.meta{margin-top:6px;font-size:11px;color:#acbfd5}
#connection{color:#b1d9f5;font-weight:600}
#notice{color:#c9e9ba}
#logpanel{max-height:142px;overflow:auto;border-top:1px solid #415875;margin-top:7px;padding-top:4px}
.entry{font:11px/1.45 ui-monospace,monospace;padding:2px 0;border-bottom:1px solid #2d3e52;overflow-wrap:anywhere}
#cdq{width:100%;flex:1;border:0;min-height:260px;background:#e8eef7}
.warning{color:#ffd49b}
@media(max-width:650px){
 header{padding:6px 8px}
 h1{font-size:13px}
 .actions{gap:5px;margin-top:5px}
 button,a.btn{font-size:11px;padding:6px 7px}
 .meta{font-size:10px}
}
</style>
</head>
<body>
<header>
 <div class="topline"><h1>CDQ — Diagnostic de vitesse Drive</h1><span id="state">Diagnostic arrêté</span></div>
 <div class="actions">
  <button class="primary" id="start" type="button">Démarrer une nouvelle mesure</button>
  <button id="mark-open" type="button" title="Repère facultatif juste avant de toucher le PDF">Repère ouvrir PDF</button>
  <button id="mark-save" type="button" title="Repère facultatif juste avant Enregistrer">Repère enregistrer</button>
  <button id="share" type="button">Partager vers Drive</button>
  <button id="download" type="button">Télécharger JSON</button>
  <button id="copy" type="button">Copier</button>
  <button id="details" type="button">Afficher le journal</button>
 </div>
 <div class="meta">
  <span id="connection">Chargement de CDQ…</span>
  <span>•</span>
  <span class="warning">Utilise seulement le client CDQ TEST, jamais les dossiers clients réels.</span>
  <span>•</span>
  <span>App web CDQ : ne mesure pas directement l’APK Android.</span>
 </div>
 <div class="meta"><span id="summary">0 événements</span><span id="notice"></span></div>
 <div id="logpanel" hidden><div id="events">Aucun événement pour le moment.</div></div>
</header>
<iframe id="cdq" title="Application CDQ Étalonnage — version web réelle" src="./index.html" allow="identity-credentials-get; clipboard-write; clipboard-read"></iframe>
<script type="module" src="./diagnostic-drive-v2764.mjs"></script>
</body>
</html>
